{% extends 'base.html' %}

{% block title %}Select Movie{% endblock %}

{% block content %}
<div class="container">
    <h1 class="heading">Select Movie</h1>
  <p>

    {% for movie in movie_titles_list %}
      <a href="{{ url_for('select', real_movie_name=movie)}}">
        {{ movie }} </a> <br>
    {% endfor %}
  </p>

</div>
{% endblock %}
